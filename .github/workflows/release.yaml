name: Build and Release

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

env:
  GO_VERSION: '1.21'
  BINARY_NAME: 'bluengo-worker'

jobs:
  build:
    name: Build Multi-Platform
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Set version
        id: set_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=$(date +'%Y.%m.%d')-develop" >> $GITHUB_ENV
          fi
          
      - name: Build for multiple platforms
        run: |
          # Create build directory
          mkdir -p build
          
          # Build for Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags="-X main.Version=${{ env.VERSION }}" -o build/${BINARY_NAME}_windows_amd64.exe main.go
          
          # Build for Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-X main.Version=${{ env.VERSION }}" -o build/${BINARY_NAME}_linux_amd64 main.go
          
          # Build for Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags="-X main.Version=${{ env.VERSION }}" -o build/${BINARY_NAME}_linux_arm64 main.go
          
          # Create checksums
          cd build
          sha256sum * > checksums.txt
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/*
          tag_name: ${{ env.VERSION }}
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/develop' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



















































































































