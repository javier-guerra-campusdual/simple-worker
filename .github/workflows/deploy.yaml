name: Docker Build and Push to ECR

on:
  push:
    branches: [develop ]  

env:
    AWS_ECR_URL: 248189943700.dkr.ecr.eu-west-1.amazonaws.com/app-bluengo-jfl

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-1
    
    - name: Login to Amazon ECR
      run: |
       aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin $AWS_ECR_URL
    
    - name: Build Docker Images
      run:
        cd simple-worker
        docker build -t $AWS_ECR_URL:app-bluengo-server -f Dockerfile.server .
        docker build -t $AWS_ECR_URL:app-bluengo-server -f Dockerfile.worker .
    
    - name: Push Docker Images to ECR      
      run: |
        docker push $AWS_ECR_URL:app-bluengo-server
        docker push $AWS_ECR_URL:app-bluengo-worker
        