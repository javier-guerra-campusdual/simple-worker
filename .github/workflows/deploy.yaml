name: Docker Build and Push to ECR

on:
 push:
   branches: [develop]  

env:
   AWS_ECR_URL: 248189943700.dkr.ecr.eu-west-1.amazonaws.com/ecr-jgl-deploy

jobs:
 build-and-push:
   runs-on: ubuntu-latest
   
   steps:
   - uses: actions/checkout@v4
   
   - uses: aws-actions/configure-aws-credentials@v4
     with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: eu-west-1
   
   - name: Login to Amazon ECR
     uses: aws-actions/amazon-ecr-login@v2
   
   - name: Build and Push Docker Images
     run: |
       # Verificar ubicación actual
       pwd
       ls -la
       
       # Construir imágenes
       docker build -t $AWS_ECR_URL:bluengo-server -f Dockerfile.server .
       docker build -t $AWS_ECR_URL:bluengo-worker -f Dockerfile.worker .
       
       # Push imágenes
       docker push $AWS_ECR_URL:bluengo-server
       docker push $AWS_ECR_URL:bluengo-worker